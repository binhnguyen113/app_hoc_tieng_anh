<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng Dụng Ôn Từ Vựng Tiếng Anh</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Dùng font Inter cho giao diện hiện đại -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div>
        <p class="eyebrow">Vocabulary Lab</p>
        <h1>Flashcard English</h1>  
      </div>

      <div class="header-actions">
        <button class="btn-toggle-mode" id="btn-toggle-mode">🎮 Làm Quiz</button>
        <button class="btn-primary small" id="typing-mode-btn">⌨️ Gõ từ</button>
      </div>
    </header>

    <div class="study-panel">
      <div class="panel-header">
        <span>Chế độ ôn tập</span>
        <div class="stats">
          <span>Từ số: <strong id="current-index">1</strong> / <strong id="total-words">0</strong></span>
        </div>
      </div>

      <div class="filter-stack">
        <label for="data-source">Bộ từ vựng</label>
        <select id="data-source">
          <option value="all">Tất cả bộ từ</option>
        </select>

        <label for="study-mode">Ôn theo</label>
        <select id="study-mode">
          <option value="all">Ôn từ vựng</option>
          <option value="topic">Ôn theo chủ đề</option>
          <option value="noun">Ôn theo noun</option>
          <option value="verb">Ôn theo verb</option>
          <option value="adjective">Ôn theo adjective</option>
        </select>
        <select id="topic-filter" class="hidden">
          <option value="all">Tất cả chủ đề</option>
        </select>
      </div>
    </div>

    <!-- MÀN HÌNH 1: FLASHCARD (Giữ nguyên cấu trúc cũ) -->
    <div id="flashcard-screen" class="screen">
      <main class="flashcard-container">
        <div class="card" id="card">
          <div class="card-face card-front">
            <span class="type" id="word-type">noun</span>
            <h2 class="word" id="word-text">Hello</h2>
            <p class="phonetic" id="word-phonetic">/həˈləʊ/</p>
            <button class="btn-audio" id="btn-speak" title="Phát âm">🔊</button>
          </div>
          
          <div class="card-face card-back">
            <h3 class="meaning" id="word-meaning">Xin chào</h3>
            <p class="example" id="word-example">"Hello, how are you today?"</p>
          </div>
        </div>
      </main>

      <footer class="controls">
        <button class="btn" id="btn-prev">⬅ Trước</button>
        <button class="btn btn-primary" id="btn-flip">🔄 Lật thẻ</button>
        <button class="btn" id="btn-next">Tiếp ➡</button>
      </footer>
    </div>

    <!-- MÀN HÌNH 2: QUIZ TRẮC NGHIỆM (Mới thêm) -->
    <div id="quiz-screen" class="screen hidden">
      <div class="quiz-box">
        <div class="quiz-header">
          <span>Điểm: <strong id="quiz-score">0</strong></span>
          <span id="quiz-progress">Câu 1/5</span>
        </div>
        <h3 class="quiz-question-word" id="quiz-word">Vocabulary</h3>
        <p class="quiz-question-type" id="quiz-word-type">noun</p>
        <p class="quiz-phonetic" id="quiz-phonetic">/vəˈkæbjeleri/</p>
        <p class="quiz-example" id="quiz-example">Reading books helps increase your vocabulary.</p>
        <button class="btn btn-primary btn-full" id="btn-quiz-speak" type="button">🔊 Phát âm</button>
        
        <div class="quiz-options" id="quiz-options">
          <!-- Các nút đáp án sẽ được JS render tự động vào đây -->
        </div>

        <button class="btn btn-primary btn-full" id="btn-next-quiz">Câu tiếp theo ➡</button>
      </div>
    </div>

    <div id="typing-screen" class="screen hidden">
      <div class="quiz-box">
        <div class="quiz-header">
          <span>Điểm: <strong id="typing-score">0</strong></span>
          <span id="typing-progress">Câu 1/5</span>
        </div>

        <p class="typing-label">Nghĩa tiếng Việt</p>
        <h3 class="quiz-question-word" id="typing-meaning">Kiên trì</h3>

        <input id="typing-input" type="text" class="typing-input" placeholder="Nhập từ tiếng Anh..." autocomplete="off" />

        <button class="btn btn-primary btn-full" id="btn-check-typing">Kiểm tra</button>
        <p id="typing-feedback" class="typing-feedback"></p>
        <button class="btn btn-primary btn-full hidden" id="btn-next-typing">Câu tiếp theo ➡</button>
      </div>
    </div>

  </div>


  <script src="app.js"></script>
</body>
</html>
